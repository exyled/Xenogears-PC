name: macOS build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - run: sh build-mac.sh universal
      - uses: actions/upload-artifact@v4
        with:
          name: Xenogears-mac
          path: source/Xenogears
